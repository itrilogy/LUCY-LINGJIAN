<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="聆涧 · LingJian">
  <!--
    聆涧 · LingJian 产品 favicon（鹿溪 CI）
    - 鹿溪绿底 #0D5E42
    - 涧壁：两道崖线
    - 清溪 #00D2FF 贯穿
    - 聆：涧口开合弧（耳）
    - 标题金水珠 + 源启星
  -->
  <defs>
    <linearGradient id="lj-bg" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#127A55"/>
      <stop offset="100%" stop-color="#0D5E42"/>
    </linearGradient>
    <linearGradient id="lj-stream" x1="16" y1="8" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CF0FF" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#00D2FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#lj-bg)"/>
  <circle cx="9" cy="8" r="6.5" fill="#ffffff" opacity="0.06"/>
  <!-- 涧壁 -->
  <path d="M9.2 9.5 L13.4 26.5" fill="none" stroke="#F5F7FA" stroke-width="1.35" stroke-linecap="round" opacity="0.9"/>
  <path d="M22.8 9.8 L18.6 26.5" fill="none" stroke="#F5F7FA" stroke-width="1.35" stroke-linecap="round" opacity="0.85"/>
  <!-- 聆：涧口耳廓 -->
  <path d="M11.2 8.6 C13.4 6.4, 18.6 6.4, 20.8 8.8" fill="none" stroke="#F5F7FA" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M13.1 10.2 C14.6 8.9, 17.5 8.9, 19 10.3" fill="none" stroke="#F5F7FA" stroke-width="1.15" stroke-linecap="round" opacity="0.7"/>
  <!-- 溪 -->
  <path d="M16 9.2 C14.6 13.4, 17.5 16.2, 15.6 20.4 C14.2 23.6, 16.8 25.4, 16.2 27.4"
        fill="none" stroke="url(#lj-stream)" stroke-width="1.55" stroke-linecap="round"/>
  <circle cx="16.05" cy="21.2" r="1.35" fill="#F1C40F"/>
  <g transform="translate(23.6 7.4)">
    <path d="M0-2.05 L0.42-0.42 L2.05 0 L0.42 0.42 L0 2.05 L-0.42 0.42 L-2.05 0 L-0.42-0.42 Z" fill="#00D2FF"/>
    <circle cx="0" cy="0" r="0.4" fill="#F5F7FA"/>
  </g>
</svg>
